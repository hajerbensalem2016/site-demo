# Collecte quotidienne des démos (scraping, veille, KPI) — 100 % gratuit sur GitHub Actions.
#
# - Tous les jours à 05:00 UTC (07:00 Paris en été, 06:00 en hiver).
# - Déclenchement manuel : onglet Actions > "Collecte des démos" > Run workflow,
#   ou via l'API GitHub (workflow_dispatch) depuis n8n — voir scripts/README.md.
# - Les résultats JSON sont commités dans data/ ; Vercel / GitHub Pages redéploient.
#
# Le workflow fonctionne que la racine du dépôt soit `site-demo/` ou le projet parent
# (détection automatique du dossier dans l'étape "Localiser site-demo").

name: Collecte des démos

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      cible:
        description: "Catégorie, mot-clé ou URL books.toscrape.com (vide = catalogue)"
        required: false
        default: ""
      scripts:
        description: "Scripts à lancer"
        required: false
        default: "tous"
        type: choice
        options: [tous, prix, veille, kpi]

permissions:
  contents: write

concurrency:
  group: collecte-demos
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Localiser site-demo
        id: wd
        run: |
          if [ -f site-demo/scripts/scrape_prix.py ]; then echo "dir=site-demo" >> "$GITHUB_OUTPUT";
          elif [ -f scripts/scrape_prix.py ]; then echo "dir=." >> "$GITHUB_OUTPUT";
          else echo "scripts/scrape_prix.py introuvable" >&2; exit 1; fi

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ steps.wd.outputs.dir }}/scripts/requirements.txt

      - name: Installer les dépendances
        working-directory: ${{ steps.wd.outputs.dir }}/scripts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then pip install "gspread>=6,<7"; fi

      - name: Tests hors ligne
        working-directory: ${{ steps.wd.outputs.dir }}/scripts
        run: pytest -q

      - name: Scraping des prix
        if: ${{ github.event.inputs.scripts == '' || github.event.inputs.scripts == 'tous' || github.event.inputs.scripts == 'prix' }}
        working-directory: ${{ steps.wd.outputs.dir }}/scripts
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scrape_prix.py --cible "${{ github.event.inputs.cible }}" --pages 2

      - name: Veille RSS
        if: ${{ github.event.inputs.scripts == '' || github.event.inputs.scripts == 'tous' || github.event.inputs.scripts == 'veille' }}
        working-directory: ${{ steps.wd.outputs.dir }}/scripts
        continue-on-error: true
        env:
          FLUX_RSS: ${{ vars.FLUX_RSS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -n "$FLUX_RSS" ]; then python veille_annonces.py --flux "$FLUX_RSS"; else python veille_annonces.py; fi

      - name: Rapport KPI
        if: ${{ github.event.inputs.scripts == '' || github.event.inputs.scripts == 'tous' || github.event.inputs.scripts == 'kpi' }}
        working-directory: ${{ steps.wd.outputs.dir }}/scripts
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python rapport_kpi.py

      - name: Commiter les résultats dans data/
        working-directory: ${{ steps.wd.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans data/ : rien à commiter."
          else
            git commit -m "chore(data): collecte automatique du $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
