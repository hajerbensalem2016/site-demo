  <main class="container demo-head">

      <form id="form" novalidate>

          <div class="field"><label for="email" data-i18n="f_email"></label><input type="email" id="email" required maxlength="120" placeholder="vous@entreprise.com"></div>

        <div class="field"><label for="entreprise" data-i18n="f_entreprise"></label><input type="text" id="entreprise" maxlength="80" data-i18n-placeholder="f_entreprise_ph"></div>

      </form>
      <div class="quota-msg" data-quota-msg></div>
      <div class="result" id="result"></div>

      <h3 style="margin-top:22px" data-i18n="p_board"></h3>
      <p class="muted small" data-i18n="p_board_hint"></p>

      <div class="quota" data-quota></div>
    </section>

    </section>

    </section>

    <section>

      </div>
    </section>

  <script>
    (function () {
      var D = window.Demo, SLUG = 'crm-notion';
      var form = D.qs('#form'), btn = D.qs('#run'), result = D.qs('#result'), kanban = D.qs('#kanban');

      var board = {
        col1: [{ nom: 'Léa Bernard', entreprise: 'Bernard Conseil', score: 48 }, { nom: 'Tom Girard', entreprise: 'Girard Bio', score: 35 }],
        col2: [{ nom: 'Nadia Khelifi', entreprise: 'Khelifi Immo', score: 74 }, { nom: 'Paul Lefèvre', entreprise: 'LFV Agency', score: 68 }],
        col3: [{ nom: 'Clinique Saint-Louis', entreprise: 'Santé', score: 91 }]
      };
      function renderBoard() {
        kanban.innerHTML = ['col1', 'col2', 'col3'].map(function (c) {
          return '<div class="col"><h4><span>' + D.escapeHtml(D.t(c)) + '</span><span>' + board[c].length + '</span></h4>' +
            board[c].map(function (l) {
              return '<div class="lead-card' + (l.isNew ? ' new' : '') + '"><span class="score" title="' + D.escapeHtml(D.t('score_label')) + '">' + l.score + '</span><b>' + D.escapeHtml(l.nom) + '</b><span class="muted">' + D.escapeHtml(l.entreprise || '—') + '</span></div>';
            }).join('') + '</div>';
        }).join('');
      }
      renderBoard();
      document.addEventListener('demo:lang', renderBoard);

      function payload() {
        return { nom: D.qs('#nom').value.trim(), email: D.qs('#email').value.trim(), entreprise: D.qs('#entreprise').value.trim(), besoin: D.qs('#besoin').value.trim() };
      }
      function valid(p) { return p.nom.length >= 2 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(p.email); }

      /* Score local (simulation) : entreprise + longueur/mots-clés du besoin + domaine email pro */
      function score(p) {
        var s = 30, b = p.besoin.toLowerCase();
        if (p.entreprise) s += 15;
        if (!/gmail|yahoo|hotmail|outlook|free\.fr/.test(p.email)) s += 10;
        if (b.length > 40) s += 10;
        if (/urgent|rapidement|asap|vite|quickly/.test(b)) s += 15;
        if (/budget|€|\$|devis|quote|prix|price/.test(b)) s += 10;
        if (/crm|automat|chatbot|agent|n8n|make|zapier|hubspot|notion|airtable/.test(b)) s += 10;
        return Math.min(98, s);
      }
      function place(p, sc, message, offline) {
        var col = sc >= 65 ? 'col2' : 'col1';
        board[col].forEach(function (l) { l.isNew = false; });
        board[col].unshift({ nom: p.nom, entreprise: p.entreprise, score: sc, isNew: true });
        renderBoard();
        result.innerHTML = '';
        var ok = document.createElement('div'); ok.className = 'banner banner-success';
        ok.textContent = (message ? message + ' ' : '') + D.t('p_added', { score: sc, col: D.t(col) });
        result.appendChild(ok);
        if (offline) D.offlineBanner(result);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var p = payload();
        result.innerHTML = '';
        if (!valid(p)) { D.errorBanner(result, D.t('p_invalid')); return; }
        if (!D.consumeQuota(SLUG)) return;
        D.setBusy(btn, true);
        var url = D.CFG.webhookCrm, sc = score(p);
        var run = D.isTodo(url)
          ? D.sleep(800).then(function () { place(p, sc, '', true); })
          : D.postJson(url, p).then(function (data) {
              if (!data || data.ok !== true) throw new Error('webhook failed');
              place(p, typeof data.score === 'number' ? data.score : sc, data.message || '', false);
            }).catch(function () { place(p, sc, '', true); });
        run.then(function () { D.setBusy(btn, false); D.renderQuota(SLUG); form.reset(); });
      });
    })();
  </script>
