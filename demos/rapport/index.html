<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapport automatique · HBSGo</title>
  <meta name="description" content="Trois chiffres suffisent : l'IA rédige votre rapport d'activité, prêt à exporter en PDF. Démo interactive gratuite.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../style.css">
  <script src="../../config.js"></script>
  <style>
    /* Couleurs des graphiques (validées daltonisme + contraste, clair et sombre) */
    :root { --series-1: #2a78d6; --series-2: #eb6834; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --series-1: #3987e5; --series-2: #d95926; } }
    :root[data-theme="dark"] { --series-1: #3987e5; --series-2: #d95926; }
    .adv-toggle { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; cursor: pointer; }
    .adv-toggle input { width: 18px; height: 18px; accent-color: var(--primary); }
    .adv-zone { border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 14px; margin: 8px 0 14px; min-width: 0; }
    .adv-zone .row { margin-bottom: 12px; }
    .charts { display: grid; gap: 14px; grid-template-columns: 1fr; margin: 16px 0; }
    @media (min-width: 760px) { .charts.two { grid-template-columns: 1fr 1fr; } }
    .chart { background: var(--bg-soft); border-radius: var(--radius-sm); padding: 14px; min-width: 0; }
    .chart h3 { margin: 0 0 2px; font-size: .95rem; }
    .chart .sub { margin: 0 0 8px; font-size: .8rem; color: var(--text-muted); }
    .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--text-muted); margin-top: 6px; }
    .chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .chart .legend i.dash { height: 0; border-top: 2px dashed var(--text-muted); border-radius: 0; vertical-align: 3px; }
    .chart .axis { stroke: var(--border); stroke-width: 1; }
    .chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
    .chart text { fill: var(--text-muted); font-size: 14px; font-family: var(--font); }
    .chart text.val { fill: var(--text); font-weight: 600; font-size: 15px; }
    .chart .hit:hover + .mark, .chart .mark:hover { opacity: .8; }
    .chart .kpi-evo { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chart .kpi-evo span { font-size: .78rem; padding: 3px 8px; border-radius: 999px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); }
    @media print { .charts { break-inside: avoid; } .chart { background: none; border: 1px solid #ccc; } }
  </style>
</head>
<body data-root="../../" data-demo="rapport" data-title-key="p_title">
  <header id="site-header"></header>

  <main class="container demo-head">
    <a class="back no-print" href="../../" data-i18n="back_home"></a>
    <span class="benefit no-print" data-i18n="p_benefit"></span>
    <h1 class="no-print" data-i18n="p_title"></h1>
    <p class="lead no-print" data-i18n="p_lead"></p>

    <section class="card test-zone">
      <div class="no-print">
        <h2><span data-i18n="test_zone"></span><span class="badge-live">Live</span></h2>
        <p class="muted small" data-i18n="p_hint"></p>
        <form id="form" novalidate>
          <div class="row row-3">
            <div class="field"><label for="ca" data-i18n="f_ca"></label><input type="number" id="ca" min="0" step="1" value="48200" required></div>
            <div class="field"><label for="depenses" data-i18n="f_dep"></label><input type="number" id="depenses" min="0" step="1" value="31500" required></div>
            <div class="field"><label for="clients" data-i18n="f_cli"></label><input type="number" id="clients" min="0" step="1" value="37" required></div>
          </div>
          <label class="adv-toggle"><input type="checkbox" id="adv"> <b data-i18n="p_adv"></b> <span class="muted small" data-i18n="p_adv_sub"></span></label>
          <fieldset id="adv-zone" class="adv-zone" hidden>
            <p class="muted small" style="margin:0 0 10px" data-i18n="p_adv_hint"></p>
            <div class="row row-3">
              <div class="field"><label for="p-ca" data-i18n="f_pca"></label><input type="number" id="p-ca" min="0" step="1" value="44100"></div>
              <div class="field"><label for="p-dep" data-i18n="f_pdep"></label><input type="number" id="p-dep" min="0" step="1" value="30200"></div>
              <div class="field"><label for="p-cli" data-i18n="f_pcli"></label><input type="number" id="p-cli" min="0" step="1" value="34"></div>
            </div>
            <div class="row row-2">
              <div class="field"><label for="objectif" data-i18n="f_obj"></label><input type="number" id="objectif" min="0" step="1" value="50000"></div>
              <div class="field"><label for="secteur" data-i18n="f_sect"></label>
                <select id="secteur">
                  <option value="" data-i18n="sect_none"></option>
                  <option value="ecommerce" data-i18n="sect_ecommerce"></option>
                  <option value="services" data-i18n="sect_services"></option>
                  <option value="restauration" data-i18n="sect_restauration"></option>
                  <option value="artisanat" data-i18n="sect_artisanat"></option>
                  <option value="autre" data-i18n="sect_autre"></option>
                </select></div>
            </div>
            <div class="field"><label for="histo" data-i18n="f_histo"></label><input type="text" id="histo" value="39800; 41200; 40500; 43000" inputmode="decimal" data-i18n-placeholder="f_histo_ph"></div>
          </fieldset>
          <button type="submit" class="btn" id="run" data-run data-i18n="p_run"></button>
        </form>
        <div class="quota-msg" data-quota-msg></div>
      </div>
      <div class="charts" id="charts" hidden></div>
      <div class="result" id="result"></div>
      <div class="md-tools no-print" id="tools" hidden>
        <button type="button" class="btn btn-ghost btn-sm" id="dl" data-i18n="p_download"></button>
        <button type="button" class="btn btn-ghost btn-sm" id="print" data-i18n="p_print"></button>
      </div>
      <div class="quota no-print" data-quota></div>
    </section>

    <section class="card no-print">
      <h2 data-i18n="loom_title"></h2>
      <div class="video" data-loom="rapport"></div>
    </section>

    <section class="no-print">
      <h2 data-i18n="how_title"></h2>
      <ol class="steps">
        <li><span class="n">1</span><div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div></li>
        <li><span class="n">2</span><div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div></li>
        <li><span class="n">3</span><div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div></li>
      </ol>
    </section>

    <section class="cta no-print" data-cta>
      <h2 data-i18n="cta_title"></h2>
      <p data-i18n="cta_text"></p>
      <div class="btns">
        <a class="btn" data-cta-upwork data-i18n="cta_upwork"></a>
        <a class="btn btn-outline" data-cta-malt data-i18n="cta_malt"></a>
      </div>
    </section>

    <p class="no-print" style="margin-top:24px"><a class="back" href="../../" data-i18n="back_home"></a></p>
  </main>

        "c_reach": "Objetivo alcanzado en {v}",
        "f_ca": "Ingresos (€)",
        "f_dep": "Gastos (€)",
        "f_cli": "Número de clientes",
        "p_run": "Generar mi informe",
        "p_invalid": "Por favor, introduzca tres números positivos.",
        "p_download": "Descargar (.md)",
        "p_print": "Imprimir / guardar como PDF",
        "s1t": "Recopilación de datos",
        "s1d": "n8n lee automáticamente Google Sheets, Stripe, Shopify, HubSpot o su base de datos cada semana o mes.",
        "s2t": "Calcular, luego escribir",
        "s2d": "El programa calcula los KPI (margen, cambios, objetivo, tendencia) sin margen de error; la IA redacta el análisis y 3 recomendaciones concretas.",
        "s3t": "Entrega automática",
        "s3d": "El informe y sus gráficos se convierten a PDF y se envían por correo a la dirección (y se publican en Slack si lo usa), sin intervención."
      }
    };
  </script>
  <script src="../../app.js"></script>
  <script>
    (function () {
      var D = window.Demo, SLUG = 'rapport';
      var form = D.qs('#form'), btn = D.qs('#run'), result = D.qs('#result'), tools = D.qs('#tools');
      var lastMd = '';

      function num(id) { return parseFloat(D.qs(id).value); }
      function fmt(n) { return new Intl.NumberFormat(D.getLang() === 'fr' ? 'fr-FR' : 'en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n); }
      function pct(n) { return (Math.round(n * 10) / 10).toLocaleString(D.getLang() === 'fr' ? 'fr-FR' : 'en-GB') + ' %'; }

      /* Simulation locale (mode hors ligne) : même format de sortie que /api/rapport ({ rapport_markdown }) */
      function simulate(ca, dep, cli) {
        var fr = D.getLang() === 'fr';
        var marge = ca - dep, taux = ca > 0 ? (marge / ca) * 100 : 0, panier = cli > 0 ? ca / cli : 0, coutClient = cli > 0 ? dep / cli : 0;
        var date = new Date().toLocaleDateString(fr ? 'fr-FR' : 'en-GB', { month: 'long', year: 'numeric' });
        var reco = [];
        if (taux < 15) reco.push(fr ? 'Marge sous 15 % : passer en revue les 5 postes de dépenses les plus lourds et renégocier ou automatiser au moins deux d\'entre eux.' : 'Margin under 15%: review the 5 heaviest expense lines and renegotiate or automate at least two of them.');
        else if (taux < 30) reco.push(fr ? 'Marge correcte (15–30 %) : viser 30 % en réduisant les tâches manuelles répétitives (facturation, relances, reporting).' : 'Healthy margin (15–30%): aim for 30% by cutting repetitive manual tasks (invoicing, follow-ups, reporting).');
        else reco.push(fr ? 'Marge solide (> 30 %) : réinvestir une partie dans l\'acquisition (publicité, contenu, partenariats) pour accélérer.' : 'Strong margin (> 30%): reinvest part of it in acquisition (ads, content, partnerships) to accelerate.');
        if (panier < 500) reco.push(fr ? 'Panier moyen faible : proposer une offre supérieure ou un abonnement pour augmenter la valeur par client.' : 'Low average basket: introduce a premium tier or a subscription to raise value per customer.');
        else reco.push(fr ? 'Panier moyen élevé : mettre en place une séquence de fidélisation automatique (email + relance à 30 jours) pour sécuriser le renouvellement.' : 'High average basket: set up an automatic retention sequence (email + 30-day follow-up) to secure renewals.');
        reco.push(fr ? 'Automatiser ce rapport : collecte des chiffres, rédaction et envoi PDF chaque lundi à 8 h, sans intervention.' : 'Automate this report: data collection, writing and PDF delivery every Monday at 8 am, hands-free.');
        var verdict = taux >= 30 ? (fr ? 'excellente' : 'excellent') : taux >= 15 ? (fr ? 'saine' : 'healthy') : (fr ? 'fragile' : 'fragile');
        if (fr) return [
          '# Rapport d\'activité — ' + date,
          '',
          '## Synthèse',
          'Sur la période, l\'activité a généré **' + fmt(ca) + '** de chiffre d\'affaires pour **' + fmt(dep) + '** de dépenses, soit une marge de **' + fmt(marge) + '** (' + pct(taux) + '). Avec **' + cli + ' clients**, le panier moyen s\'établit à **' + fmt(panier) + '**. La rentabilité est ' + verdict + '.',
          '',
          '## Indicateurs clés',
          '| Indicateur | Valeur |',
          '|---|---|',
          '| Chiffre d\'affaires | ' + fmt(ca) + ' |',
          '| Dépenses | ' + fmt(dep) + ' |',
          '| Marge nette | ' + fmt(marge) + ' |',
          '| Taux de marge | ' + pct(taux) + ' |',
          '| Clients actifs | ' + cli + ' |',
          '| Panier moyen | ' + fmt(panier) + ' |',
          '| Coût par client | ' + fmt(coutClient) + ' |',
          '',
          '## Recommandations',
          reco.map(function (r, i) { return (i + 1) + '. ' + r; }).join('\n'),
          '',
          '## Prochaine étape',
          'Ce rapport peut être généré et envoyé automatiquement chaque semaine ou chaque mois (Google Sheets → n8n → IA → PDF → email), sans aucune saisie.'
        ].join('\n');
        return [
          '# Activity report — ' + date,
          '',
          '## Summary',
          'Over the period, the business generated **' + fmt(ca) + '** in revenue against **' + fmt(dep) + '** in expenses, a margin of **' + fmt(marge) + '** (' + pct(taux) + '). With **' + cli + ' customers**, the average basket is **' + fmt(panier) + '**. Profitability is ' + verdict + '.',
          '',
          '## Key indicators',
          '| Indicator | Value |',
          '|---|---|',
          '| Revenue | ' + fmt(ca) + ' |',
          '| Expenses | ' + fmt(dep) + ' |',
          '| Net margin | ' + fmt(marge) + ' |',
          '| Margin rate | ' + pct(taux) + ' |',
          '| Active customers | ' + cli + ' |',
          '| Average basket | ' + fmt(panier) + ' |',
          '| Cost per customer | ' + fmt(coutClient) + ' |',
          '',
          '## Recommendations',
          reco.map(function (r, i) { return (i + 1) + '. ' + r; }).join('\n'),
          '',
          '## Next step',
          'This report can be generated and sent automatically every week or month (Google Sheets → n8n → AI → PDF → email), with no manual entry.'
        ].join('\n');
      }

      function render(md, offline) {
        lastMd = md;
        result.innerHTML = '<div class="md" id="md">' + D.md2html(md) + '</div>';
        if (offline) D.offlineBanner(result);
        tools.removeAttribute('hidden');
      }

      /* ---------- mode avancé ---------- */
      var adv = D.qs('#adv'), advZone = D.qs('#adv-zone'), charts = D.qs('#charts');
      adv.addEventListener('change', function () { advZone.hidden = !adv.checked; });

      function optNum(id) { var v = D.qs(id).value.trim(); if (v === '') return null; var n = parseFloat(v); return n >= 0 ? n : NaN; }
      function readAdvanced() {
        if (!adv.checked) return null;
        var prec = { ca: optNum('#p-ca'), depenses: optNum('#p-dep'), clients: optNum('#p-cli') };
        var objectif = optNum('#objectif');
        var raw = D.qs('#histo').value.trim();
        var histo = raw ? raw.split(/[;\n]+/).map(function (s) { return parseFloat(s.replace(/\s/g, '').replace(',', '.')); }) : [];
        if (histo.length > 11 || histo.some(function (n) { return !(n >= 0); })) return { error: D.t('p_histo_bad') };
        if ([prec.ca, prec.depenses, prec.clients, objectif].some(function (n) { return n !== null && isNaN(n); })) return { error: D.t('p_invalid') };
        var out = {};
        if (prec.ca !== null || prec.depenses !== null || prec.clients !== null) out.precedent = prec;
        if (objectif !== null) out.objectif = objectif;
        if (histo.length) out.historique = histo;
        if (D.qs('#secteur').value) out.secteur = D.qs('#secteur').value;
        return out;
      }

      /* ---------- graphiques (SVG, calculés dans le navigateur à partir des mêmes chiffres) ---------- */
      var NS = 'http://www.w3.org/2000/svg';
      function loc() { return D.getLang() === 'fr' ? 'fr-FR' : 'en-GB'; }
      function money(n) { return new Intl.NumberFormat(loc(), { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n); }
      function short(n) { return new Intl.NumberFormat(loc(), { notation: 'compact', maximumFractionDigits: 1 }).format(n) + ' €'; }
      function pctSigned(n) { var s = (Math.round(n * 10) / 10).toLocaleString(loc()) + ' %'; return (n > 0 ? '+' : '') + s; }
      function niceScale(min, max, ticks) {
        var span = (max - min) || Math.abs(max) || 1, raw = span / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw)));
        var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).find(function (s) { return s >= raw; });
        return { min: Math.floor(min / step) * step, max: Math.ceil(max / step) * step, step: step };
      }
      function el(tag, attrs, text) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (text !== undefined) e.textContent = text;
        return e;
      }
      /* barre à coins arrondis côté valeur (4 px), ancrée à la ligne de base */
      function barPath(x, w, y0, y1) {
        var r = Math.min(4, w / 2, Math.abs(y1 - y0)), up = y1 < y0;
        if (up) return 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 + r) + 'V' + y0 + 'Z';
        return 'M' + x + ',' + y0 + 'V' + (y1 - r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 - r) + 'V' + y0 + 'Z';
      }
      function card(title, sub) {
        var c = document.createElement('div'); c.className = 'chart';
        c.innerHTML = '<h3>' + D.escapeHtml(title) + '</h3><p class="sub">' + D.escapeHtml(sub) + '</p>';
        return c;
      }
      function legend(items) {
        var l = document.createElement('div'); l.className = 'legend';
        l.innerHTML = items.map(function (it) { return '<span><i class="' + (it.dash ? 'dash' : '') + '" style="' + (it.dash ? '' : 'background:' + it.color) + '"></i>' + D.escapeHtml(it.label) + '</span>'; }).join('');
        return l;
      }

      function barsChart(cur, prev) {
        var cats = [['c_ca', 'ca'], ['c_dep', 'depenses'], ['c_marge', 'marge']];
        var series = [{ label: D.t('c_cur'), color: 'var(--series-1)', data: cur }];
        if (prev) series.unshift({ label: D.t('c_prev'), color: 'var(--series-2)', data: prev });
        var vals = []; series.forEach(function (s) { cats.forEach(function (c) { vals.push(s.data[c[1]]); }); });
        var sc = niceScale(Math.min(0, Math.min.apply(null, vals)), Math.max.apply(null, vals) * 1.08, 4);
        var W = 520, H = 260, L = 62, R = 8, T = 26, B = 30, pw = W - L - R, ph = H - T - B;
        var y = function (v) { return T + ph - (v - sc.min) / (sc.max - sc.min) * ph; };
        var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': D.t('c_bars_t') });
        for (var v = sc.min; v <= sc.max + 1e-9; v += sc.step) {
          svg.appendChild(el('line', { class: v === 0 ? 'axis' : 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
          svg.appendChild(el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, short(v)));
        }
        var gw = pw / cats.length, bw = Math.min(46, (gw - 28) / series.length - 2);
        cats.forEach(function (c, ci) {
          var total = series.length * bw + (series.length - 1) * 2, x0 = L + ci * gw + (gw - total) / 2;
          series.forEach(function (s, si) {
            var val = s.data[c[1]], x = x0 + si * (bw + 2), g = el('g');
            g.appendChild(el('title', {}, s.label + ' — ' + D.t(c[0]) + ' : ' + money(val)));
            g.appendChild(el('path', { class: 'mark', d: barPath(x, bw, y(0), y(val)), fill: s.color }));
            svg.appendChild(g);
            if (si === series.length - 1) svg.appendChild(el('text', { class: 'val', x: x + bw / 2, y: val >= 0 ? y(val) - 6 : y(val) + 14, 'text-anchor': 'middle' }, short(val)));
          });
          svg.appendChild(el('text', { x: L + ci * gw + gw / 2, y: H - 8, 'text-anchor': 'middle' }, D.t(c[0])));
        });
        var c = card(D.t('c_bars_t'), D.t('c_bars_s'));
        c.appendChild(svg);
        if (series.length > 1) c.appendChild(legend(series.slice().reverse()));
        return c;
      }

      function lineChart(serie, objectif) {
        var n = serie.length, vals = serie.concat(objectif ? [objectif] : []);
        var sc = niceScale(Math.min.apply(null, vals) * 0.95, Math.max.apply(null, vals) * 1.05, 4);
        var W = 520, H = 260, L = 62, R = 30, T = 26, B = 30, pw = W - L - R, ph = H - T - B;
        var x = function (i) { return n === 1 ? L + pw / 2 : L + i * pw / (n - 1); };
        var y = function (v) { return T + ph - (v - sc.min) / (sc.max - sc.min) * ph; };
        var label = function (i) { return i === n - 1 ? D.t('c_now') : D.t('c_m', { n: n - 1 - i }); };
        var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': D.t('c_line_t') });
        for (var v = sc.min; v <= sc.max + 1e-9; v += sc.step) {
          svg.appendChild(el('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
          svg.appendChild(el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }, short(v)));
        }
        if (objectif) {
          svg.appendChild(el('line', { x1: L, x2: W - R, y1: y(objectif), y2: y(objectif), stroke: 'var(--text-muted)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
          svg.appendChild(el('text', { x: L + 6, y: y(objectif) - 7 }, D.t('c_obj') + ' ' + short(objectif)));
        }
        svg.appendChild(el('polyline', { points: serie.map(function (v, i) { return x(i) + ',' + y(v); }).join(' '), fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
        serie.forEach(function (v, i) {
          var g = el('g');
          g.appendChild(el('title', {}, label(i) + ' : ' + money(v)));
          g.appendChild(el('circle', { cx: x(i), cy: y(v), r: 12, fill: 'transparent' }));
          g.appendChild(el('circle', { class: 'mark', cx: x(i), cy: y(v), r: 4.5, fill: 'var(--series-1)', stroke: 'var(--bg-soft)', 'stroke-width': 2 }));
          svg.appendChild(g);
          var step = Math.ceil(n / 6);
          if (i === n - 1 || (n - 1 - i) % step === 0) svg.appendChild(el('text', { x: x(i), y: H - 8, 'text-anchor': 'middle' }, label(i)));
        });
        var last = y(serie[n - 1]), below = objectif && Math.abs(last - y(objectif)) < 22 && serie[n - 1] < objectif;
        svg.appendChild(el('text', { class: 'val', x: x(n - 1), y: below ? last + 22 : last - 12, 'text-anchor': 'end' }, short(serie[n - 1])));
        var c = card(D.t('c_line_t'), D.t('c_line_s'));
        c.appendChild(svg);
        if (objectif) c.appendChild(legend([{ label: D.t('c_ca'), color: 'var(--series-1)' }, { label: D.t('c_obj'), dash: true }]));
        return c;
      }

      function kpi(ca, dep, cli) { return { ca: ca, depenses: dep, clients: cli, marge: ca - dep, panier: cli > 0 ? ca / cli : 0 }; }
      function renderCharts(ca, dep, cli, av) {
        charts.innerHTML = '';
        var cur = kpi(ca, dep, cli), prev = null;
        if (av && av.precedent && av.precedent.ca !== null && av.precedent.depenses !== null) prev = kpi(av.precedent.ca, av.precedent.depenses, av.precedent.clients || 0);
        var bars = barsChart(cur, prev);
        var chips = [];
        if (prev) {
          [['c_ca', 'ca'], ['c_dep', 'depenses'], ['c_marge', 'marge']].forEach(function (c) {
            if (prev[c[1]] > 0) chips.push(D.t('c_evo', { k: D.t(c[0]), v: pctSigned((cur[c[1]] - prev[c[1]]) / prev[c[1]] * 100) }));
          });
        }
        if (av && av.objectif > 0) chips.push(D.t('c_reach', { v: (Math.round(ca / av.objectif * 1000) / 10).toLocaleString(loc()) + ' %' }));
        if (chips.length) {
          var k = document.createElement('div'); k.className = 'kpi-evo';
          k.innerHTML = chips.map(function (s) { return '<span>' + D.escapeHtml(s) + '</span>'; }).join('');
          bars.appendChild(k);
        }
        charts.appendChild(bars);
        var serie = [];
        if (av) {
          serie = (av.historique || []).slice();
          if (!serie.length && av.precedent && av.precedent.ca !== null) serie = [av.precedent.ca];
          if (serie.length) serie.push(ca);
        }
        if (serie.length >= 2) charts.appendChild(lineChart(serie, av.objectif > 0 ? av.objectif : null));
        charts.classList.toggle('two', charts.children.length > 1);
        charts.hidden = false;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var ca = num('#ca'), dep = num('#depenses'), cli = num('#clients');
        result.innerHTML = ''; tools.setAttribute('hidden', ''); charts.hidden = true; charts.innerHTML = '';
        if (!(ca >= 0) || !(dep >= 0) || !(cli >= 0)) { D.errorBanner(result, D.t('p_invalid')); return; }
        var av = readAdvanced();
        if (av && av.error) { D.errorBanner(result, av.error); return; }
        if (!D.consumeQuota(SLUG)) return;
        D.setBusy(btn, true);
        D.apiPost('rapport', Object.assign({ ca: ca, depenses: dep, clients: cli }, av || {}))
          .then(function (data) {
            if (!data || typeof data.rapport_markdown !== 'string') throw new Error('bad payload');
            renderCharts(ca, dep, cli, av);
            render(data.rapport_markdown, false);
          })
          .catch(function () { return D.sleep(900).then(function () { renderCharts(ca, dep, cli, av); render(simulate(ca, dep, cli), true); }); })
          .then(function () { D.setBusy(btn, false); D.renderQuota(SLUG); });
      });

      D.qs('#dl').addEventListener('click', function () {
        var blob = new Blob([lastMd], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rapport.md'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      });
      D.qs('#print').addEventListener('click', function () { window.print(); });
    })();
  </script>
</body>
</html>
